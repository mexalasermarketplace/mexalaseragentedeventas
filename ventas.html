<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figui Laser - Ventas</title>
    <style>
        body { background: #0d0d0d; color: #f5f0e8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; border: 2px solid #ff5a1f; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(255,90,31,0.4); }
        h1 { color: #ff5a1f; margin-bottom: 20px; font-size: 22px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin-bottom: 20px; box-sizing: border-box; }
        button { background: #ff5a1f; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #res { margin-top: 25px; padding: 15px; background: #262626; border-radius: 10px; text-align: left; border-left: 5px solid #ff5a1f; min-height: 60px; font-size: 14px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Asistente Figui Láser</h1>
        <input type="text" id="pregunta" placeholder="¿Precio de saleros o trofeos?">
        <button onclick="preguntar()">CONSULTAR PRECIO ✦</button>
        <div id="res">¡Hola! Soy tu asistente. Pregúntame lo que necesites del catálogo.</div>
    </div>

    <script>
        async function preguntar() {
            const p = document.getElementById('pregunta').value;
            const r = document.getElementById('res');
            const KEY = "AIzaSyB1jJekbxIL8uQZPZSWmx1rxA_m7rJGqGM";

            if(!p) return;
            r.innerHTML = "<span style='color: #ff5a1f;'>Consultando catálogo...</span>";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Eres vendedor de Figui Laser en Chalco. Catálogo: Saleros MDF $15, Trofeos $120, Medallas $35, Cajas regalo $45. Responde breve y amable a: " + p }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    r.innerHTML = data.candidates[0].content.parts[0].text;
                } else {
                    r.innerHTML = "Error: La clave no tiene permisos o el modelo está ocupado.";
                }
            } catch (error) {
                r.innerHTML = "Error de red. Revisa tu conexión a internet.";
            }
        }
    </script>
</body>
</html>
